# Deploy — typecheck gate, build the image with the repo Dockerfile, push to
# Artifact Registry, roll the Cloud Run service (IAM-gated:
# --no-allow-unauthenticated).
#
# Auth is Workload Identity Federation (OIDC) — no service-account keys.
# Required GitHub repository variables: GCP_REGION, GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL.
# Required secret: GH_PACKAGES_TOKEN (read:packages).
#
# THIS WORKFLOW IS THE SINGLE SOURCE OF TRUTH FOR RUNTIME CONFIG (the FLAGS
# array below). cloudbuild/<env>.yaml files are frozen provisioning/history
# references; their Cloud Build triggers are disabled (CD cutover 2026-08-28).
# Only dev is ported — staging/prod arms fail loudly until provisioned
# (prod's shape: dev flags + FLAGS+=(--no-traffic) + manual promotion).

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (only dev is ported; see the FLAGS case)
        type: choice
        default: dev
        options: [dev, staging, prod]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AR_REPO: gub-admin
  SERVICE: gub-admin-${{ github.event.inputs.environment || 'dev' }}
  REGION: ${{ vars.GCP_REGION }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

jobs:
  # Mirrors the retired cloudbuild typecheck step: a broken main must not
  # deploy, whether the run came from a push or a manual dispatch.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @anomaly-technology/gub-schemas lives on GitHub Packages under the
      # Anomaly-Technology org — GITHUB_TOKEN cannot read it.
      - name: Authenticate npm to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN }}" >> ~/.npmrc

      - run: npm ci

      - run: npx tsc --noEmit

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # Unported environments fail HERE, before anything is touched.
      - name: Resolve environment config
        run: |
          case "$ENVIRONMENT" in
            dev) ;;
            *)
              echo "::error::environment '$ENVIRONMENT' is not ported to this workflow — cloudbuild/$ENVIRONMENT.yaml is the provisioning reference (prod adds --no-traffic + manual promotion)."
              exit 1
              ;;
          esac
          echo "RUNTIME_SA=sa-$SERVICE@$PROJECT_ID.iam.gserviceaccount.com" >> "$GITHUB_ENV"
          echo "CLOUDSQL=$PROJECT_ID:$REGION:gub-platform" >> "$GITHUB_ENV"

      # Deploys must never CREATE the service — first-time provisioning is
      # deliberate, not a side effect of CD.
      - name: Verify target environment is provisioned
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" --format='value(metadata.name)' >/dev/null \
            || { echo "::error::Cloud Run service $SERVICE does not exist in $PROJECT_ID/$REGION. Provision '$ENVIRONMENT' deliberately first."; exit 1; }

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPO/$SERVICE"
          docker build --secret id=gh_packages_token,env=GH_PACKAGES_TOKEN -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
          echo "IMAGE_URI=$IMAGE:$SHORT_SHA" >> "$GITHUB_ENV"

      # FLAGS = the ported cloudbuild/dev.yaml deploy args, one array element
      # per arg, verbatim (note --add-cloudsql-instances — this repo's
      # historical semantics, deliberately not "normalized" to --set-).
      - name: Deploy Cloud Run service
        run: |
          case "$ENVIRONMENT" in
            dev)
              FLAGS=(
                --no-allow-unauthenticated
                --min-instances=0
                --max-instances=2
                --memory=512Mi
                --cpu=1
                --port=3000
                "--service-account=$RUNTIME_SA"
                "--set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=$REGION,RESEARCH_JOB_NAME=gub-research-worker-dev,DRIVE_SYNC_JOB_NAME=gub-drive-sync-dev,GUB_BACKEND_URL=https://gcp-universal-backend-dev-843516467880.us-central1.run.app"
                "--set-secrets=DATABASE_URL=gub-admin-db-url-dev:latest"
                "--add-cloudsql-instances=$CLOUDSQL"
              )
              ;;
            *)
              echo "::error::no FLAGS ported for '$ENVIRONMENT'"
              exit 1
              ;;
          esac
          gcloud run deploy "$SERVICE" --image "$IMAGE_URI" --region "$REGION" --platform managed "${FLAGS[@]}"

      - name: Report deployed revision
        run: |
          gcloud run services describe "$SERVICE" --region "$REGION" \
            --format='value(status.latestReadyRevisionName, status.url)'
